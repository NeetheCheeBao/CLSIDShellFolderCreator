[package]
name = "CLSIDShellFolderCreator"
edition = "2021"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow"] }
rfd = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
